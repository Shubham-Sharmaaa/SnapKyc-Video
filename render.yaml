# Render blueprint for the signaling server (apps/signal).
# The Next.js app (apps/web) is deployed on Vercel instead.
services:
  - type: web
    name: snapkyc-signal
    runtime: node
    plan: free
    buildCommand: npm ci && npx turbo run build --filter=signal
    startCommand: node apps/signal/dist/index.js
    healthCheckPath: /health
    # Redeploy only when the signal server or its shared types change. A
    # redeploy restarts the server, so web-only pushes shouldn't trigger one.
    buildFilter:
      paths:
        - apps/signal/**
        - packages/types/**
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SIGNAL_SECRET
        sync: false
